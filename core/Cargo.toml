[package]
name = "tanato-core"
version = "0.1.0"
edition = "2021"
description = "TanatoGothci core: OpenAI-compatible client, battery countdown engine, tool handling and escape detection."

[lib]
name = "tanato_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls-tls: pure-Rust TLS so the crate builds without a system OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["time", "sync", "macros", "rt-multi-thread"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full", "macros"] }
