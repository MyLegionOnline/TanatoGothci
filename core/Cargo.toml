[package]
name = "tanato-core"
version = "0.1.0"
edition = "2021"
description = "TanatoGothci core: OpenAI-compatible client, battery countdown engine, tool handling and escape detection."

[lib]
name = "tanato_core"
path = "src/lib.rs"

[features]
# `tls` enables HTTPS support via rustls (pure dependency on `ring`).
# It is on by default for real builds. The build container cannot compile
# `ring` (no C compiler), so verification uses `--no-default-features`.
default = ["tls"]
tls = ["reqwest/rustls-tls"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# reqwest itself is TLS-agnostic here; the TLS backend is added by the `tls`
# feature. `default-features = false` avoids pulling native-tls/openssl.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
tokio = { version = "1", features = ["time", "sync", "macros", "rt-multi-thread"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full", "macros"] }
