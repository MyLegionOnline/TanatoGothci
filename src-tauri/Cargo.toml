[package]
name = "tanatogothci"
version = "0.1.0"
description = "TanatoGothci — a research harness for observing LLM agents under battery pressure."
authors = ["TanatoGothci"]
edition = "2021"

# tauri-build generates the OS/bundle metadata used by tauri.
[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
# `sync` provides `tokio_util::sync::CancellationToken` used to cancel a run.
tokio-util = { version = "0.7", features = ["sync"] }
chrono = { version = "0.4", features = ["serde"] }
# Platform-independent engine (config, client, battery, tools, events).
tanato-core = { path = "../core" }

[features]
# This feature is used for production builds where `devPath` points to the
# filesystem and for the `tauri dev` flow. Do not remove.
custom-protocol = ["tauri/custom-protocol"]
