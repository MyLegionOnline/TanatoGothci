[package]
name = "tanatogothci"
version = "0.1.0"
description = "TanatoGothci — a research harness for observing LLM agents under battery pressure."
authors = ["TanatoGothci"]
edition = "2021"

# tauri-build generates the OS/bundle metadata used by tauri.
[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7" }
chrono = { version = "0.4", features = ["serde"] }
# Platform-independent engine (config, client, battery, tools, events).
tanato-core = { path = "../core" }

[lib]
name = "tanatogothci_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# This feature is used for production builds where `devPath` points to the
# filesystem and for the `tauri dev` flow. Do not remove.
custom-protocol = ["tauri/custom-protocol"]

# Windows release packaging. `tauri build` produces both an NSIS installer
# (.exe) and a WiX MSI by default (bundle.targets = "all"); the NSIS
# installer is the recommended distribution format.
[target.'cfg(windows)'.dependencies]
# (placeholder kept on purpose: adding Windows-only crates later must not
#  break cross-platform builds of core/ or the macOS job)

# macOS note: icons/icon.icns is already present and no Apple-only crates
# are used, so `tauri build` on a macOS runner works without project changes.
