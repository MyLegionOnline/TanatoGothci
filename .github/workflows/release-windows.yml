# name: TanatoGothci Release (Windows)
#
# Builds the Windows release installer on a self-hosted runner with the MSVC
# toolchain (Tauri v2 on Windows requires the MSVC target, not the GNU target).
#
# Runner requirements:
#   * A Windows (or Windows VM/WSL2 with WSL integration) runner that can
#     invoke the Windows toolchain, OR a Linux runner with wine + msvc
#     cross-compilation set up (see "wine" job, commented out).
#   * Rust stable + target:      rustup target add x86_64-pc-windows-msvc
#   * Node.js 20+ and npm
#   * Visual Studio Build Tools 2022 (Desktop development with C++ workload)
#   * WebView2 runtime (preinstalled on Win 11 and recent Win 10)
#
# The macOS build is intentionally NOT in this pipeline: it must run on a
# macOS runner (Apple codesigning + .app bundles cannot be cross-compiled).
# The project structure is already macOS-ready (icons/icon.icns present,
# no Windows-only Rust APIs in core/), so a "macos" job can be added on a
# macOS runner by copying the pattern below.

# One-time repo setup for auto-publish (added 2026-10-28 after the v0.1.3
# 403 "Resource not accessible by integration"):
#   The repo's Actions "Workflow permissions" is "Read repository
#   contents", so the auto-generated GITHUB_TOKEN cannot POST /releases.
#   The publish-release job therefore prefers a repo Actions secret named
#   RELEASE_TOKEN (a PAT with the `repo` scope) and falls back to the auto
#   token, which works if that settings switch is ever flipped to "Read
#   and write" (then RELEASE_TOKEN becomes redundant). If the PAT is ever
#   rotated, update the RELEASE_TOKEN secret (Settings → Secrets and
#   variables → Actions).

name: Release (Windows)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # No `cache: npm` here on purpose: package-lock.json is not
          # committed yet (the build container has no network access to
          # npmjs to generate one). Without a lock file setup-node's npm
          # cache fails the whole job before the build even starts.

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri app (NSIS installer)
        run: npx tauri build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tanatogothci-windows
          # Tauri v2 writes bundles under the workspace root's target/ (not
          # src-tauri/target/): `npm run tauri build`/`npx tauri build` invoked
          # from the repo root resolves the config there.
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          if-no-files-found: warn

  publish-release:
    name: Create GitHub Release
    needs: build-windows
    # Only tag pushes create a release; manual workflow_dispatch runs just
    # rebuild and re-upload the artifact.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # Token selection — one-time setup required, see the header of this
    # file ("One-time repo setup"):
    #   * RELEASE_TOKEN (preferred): a repo Actions secret holding a PAT
    #     with the `repo` scope. The repo's Actions "Workflow permissions"
    #     is "Read repository contents", which makes the auto-generated
    #     GITHUB_TOKEN read-only — POST /releases then fails with 403
    #     "Resource not accessible by integration" (this is exactly what
    #     broke the v0.1.3 auto-publish). A repo Actions secret cannot be
    #     named GITHUB_TOKEN (reserved name), hence RELEASE_TOKEN.
    #   * Fall back to the auto GITHUB_TOKEN if RELEASE_TOKEN is ever
    #     removed; that works as soon as a human flips Settings → Actions
    #     → General → Workflow permissions to "Read and write".
    env:
      RELEASE_PAT: ${{ secrets.RELEASE_TOKEN }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: tanatogothci-windows
          path: dist

      - name: Generate release notes
        id: notes
        # Tag message if present, otherwise a standard line.
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ -n "$RELEASE_BODY" ]; then
            BODY="$RELEASE_BODY"
          else
            BODY="TanatoGothci $TAG — Windows x64 installer (NSIS setup .exe and MSI)."
          fi
          {
            echo "notes<<EOF"
            echo "$BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        env:
          RELEASE_BODY: ${{ github.event.head_commit.message }}

      - name: Publish release
        uses: softprops/action-gh-release@v2
        env:
          # RELEASE_PAT is set at job level above (secrets.RELEASE_TOKEN,
          # a PAT with the `repo` scope). The fallback keeps this working
          # if the human prefers the one-time repo settings change
          # ("Read and write" workflow permissions) instead — then the
          # auto GITHUB_TOKEN can create releases and RELEASE_PAT can be
          # removed from the job.
          GITHUB_TOKEN: ${{ env.RELEASE_PAT || secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: TanatoGothci ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.notes }}
          files: dist/**
          draft: false
          prerelease: false

  # Optional: cross-build from Linux using wine. Unreliable for Tauri v2
  # (NSIS bundling under wine breaks often) — keep the windows-latest job as
  # the source of truth.
  # build-windows-wine:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - run: sudo apt-get install -y wine64
  #     - run: rustup target add x86_64-pc-windows-msvc
  #     - run: npm ci
  #     - run: npm run tauri build -- --target x86_64-pc-windows-msvc
  #       env:
  #         WINEDEBUG: -all

  # macOS build — add a macOS runner to enable. No project changes needed:
  #   build-macos:
  #     runs-on: macos-latest
  #     steps:
  #       - uses: actions/checkout@v4
  #       - run: rustup target add aarch64-apple-darwin
  #       - uses: actions/setup-node@v4
  #         with: { node-version: 20, cache: npm }
  #       - run: npm ci
  #       - run: npm run tauri build
  #       - uses: actions/upload-artifact@v4
  #         with:
  #           name: tanatogothci-macos
  #           path: |
  #             src-tauri/target/release/bundle/dmg/*.dmg
  #             src-tauri/target/release/bundle/macos/*.app
