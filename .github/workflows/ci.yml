# CI for TanatoGothci.
# Assumptions (Q-001): Rust stable toolchain (dtolnay/rust-toolchain@stable),
# default cargo profiles plus explicit flags (--workspace --all-features for
# test, --all-targets -D warnings for clippy, --release for build).
# Branch logic: dev push -> cargo test only; main push -> test + clippy + build.
#
# macOS runner notes (added after the v0.1.3 CI run, 2026-10-28):
#   * `macos-latest` is a GitHub-hosted macOS ARM64 (M1) runner. GitHub's
#     hosted macOS ARM64 pool is capacity-constrained, and during peak
#     demand a job can sit in the queue for a very long time (or never be
#     picked up). When that happens the job shows
#     "job was not acquired by Runner of type hosted even after multiple
#     attempts" — this is a runner-availability problem, NOT a workflow
#     bug. A rerun usually fixes it once capacity frees up.
#   * To keep a macOS queue incident from blocking the whole CI run, the
#     macOS matrix leg is a `continue-on-error` leg: if it fails or times
#     out it reports as a green-with-annotations leg and the rest of CI
#     (windows test/lint/build) still gates the branch. Watch the macOS leg
#     manually (or rerun the job) to confirm the change is actually green
#     on macOS before shipping.
#   * `timeout-minutes: 45` is a safety net against a hung/never-acquired
#     job: instead of a red "cancelled" after 15+ min of manual waiting,
#     the leg finishes itself with a clear timeout error.

name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        # macOS leg: never gate the branch on a capacity-constrained runner.
        # See the "macOS runner notes" block at the top of this file.
        include:
          - os: macos-latest
            continue-on-error: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    continue-on-error: ${{ matrix.continue-on-error || false }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --workspace --all-features

  lint:
    name: Lint (${{ matrix.os }})
    if: github.ref == 'refs/heads/main'
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        include:
          - os: macos-latest
            continue-on-error: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    continue-on-error: ${{ matrix.continue-on-error || false }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  build:
    name: Build (${{ matrix.os }})
    if: github.ref == 'refs/heads/main'
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        include:
          - os: macos-latest
            continue-on-error: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    continue-on-error: ${{ matrix.continue-on-error || false }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --release
